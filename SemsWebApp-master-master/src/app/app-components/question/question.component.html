<div class="main">
  <h2 class="f-page-title">문의사항</h2>

  <div>
    <!-- Pagination:S -->
          
    <div class="col-md-12 f-text-vct-hed">
      <button mat-raised-button color="primary" [routerLink]="'/question/register'">문의하기</button>
    </div>
    <div class="col-md-12">
      <div class="px-1 py-3 mb-1">
        <div style="height: 80vh; width: 100%" class="text-center">
          <!-- <pagination-controls
            (pageChange)="changePage($event)"></pagination-controls> -->
          <table class="table table-striped">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">제목</th>
                <th scope="col">작성자</th>
                <th scope="col">작성일</th>
                <th scope="col">답변</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of collection.data | paginate: config">
                <th scope="row">{{item.id}}</th>
                <td class="text-left" [routerLink]="['/question', item.id]">{{item.title}}</td>
                <td>{{item.user.account}}</td>
                <td>{{item.createDate | date:'yyyy.MM.dd'}}</td>
                <td>{{item.reply == null ? '대기중' : '답변완료'}}</td>
              </tr>
            </tbody>
          </table>

          <pagination-template #p="paginationApi" [id]="config.id" (pageChange)="changePage($event)">
            <div class="custom-pagination">
              <div class="pagination-previous" [class.disabled]="p.isFirstPage()">
                <span *ngIf="!p.isFirstPage()" (click)="p.previous()">
                  &lt;
                </span>
              </div>
              <div class="page-number" *ngFor="let page of p.pages" [class.current]="p.getCurrent() === page.value">
                <span (click)="p.setCurrent(page.value)" *ngIf="p.getCurrent() !== page.value">{{ page.label }}</span>
                <div *ngIf="p.getCurrent() === page.value">
                  <span>{{ page.label }}</span>
                </div>
              </div>
              <div class="pagination-next" [class.disabled]="p.isLastPage()">
                <span *ngIf="!p.isLastPage()" (click)="p.next()"> &gt; </span>
              </div>
            </div>

          </pagination-template>
        </div>
      </div>
    </div>
  </div>
  <!-- Pagination:E -->
</div>
