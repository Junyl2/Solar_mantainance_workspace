<div class="main">
  <div class="col-md-12">
    <div class="box">
      <div class="box1">
        <div class="box1_header">
          <div class="box1_header_1">
            <div class="title">PR 추이</div>

            <div class="radio_box">
              <div class="radio_input1" (click)="radio_input1_click()">
                <input
                  id="radio_time"
                  type="radio"
                  name="time"
                  [value]="1"
                  [checked]="true"
                />
                시간별
              </div>
              <div class="radio_input2" (click)="radio_input2_click()">
                <input id="radio_day" type="radio" name="time" [value]="2" />
                일별
              </div>
              <div class="radio_input3" (click)="radio_input3_click()">
                <input id="radio_month" type="radio" name="time" [value]="3" />
                월별
              </div>
            </div>

            <div class="padding_text">조회기간 :</div>

            <div class="date_box">
              <!-- Day pickers -->
              <div id="date_start" class="data_box1">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="startPicker"
                  [value]="startDate"
                  (dateChange)="onStartDaySelected($event.value)"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="startPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #startPicker
                  panelClass="example-month-picker"
                ></mat-datepicker>
              </div>

              <div id="date_space" class="date_space">~</div>

              <div id="date_end" class="data_box2">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="endPicker"
                  [value]="endDate"
                  (dateChange)="onEndDaySelected($event.value)"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="endPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #endPicker
                  panelClass="example-month-picker"
                ></mat-datepicker>
              </div>

              <!-- Month pickers -->
              <div id="date_start_month" class="data_month_box">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="startMonthPicker"
                  [value]="startMonthDate"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="startMonthPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #startMonthPicker
                  startView="year"
                  (yearSelected)="onStartMonthSelected($event)"
                  (monthSelected)="
                    onStartMonthMonthSelected($event, startMonthPicker)
                  "
                  panelClass="example-month-picker"
                >
                </mat-datepicker>
              </div>

              <div id="date_end_month" class="data_month_box">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="endMonthPicker"
                  [value]="endMonthDate"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="endMonthPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #endMonthPicker
                  startView="year"
                  (yearSelected)="onEndMonthSelected($event)"
                  (monthSelected)="
                    onEndMonthMonthSelected($event, endMonthPicker)
                  "
                  panelClass="example-month-picker"
                >
                </mat-datepicker>
              </div>
            </div>

            <div class="search_box">
              <button class="search_btn" (click)="search_click()">조회</button>
            </div>
          </div>

          <div class="box1_header_2">
            <div class="download_box">
              <button
                class="download_btn"
                (click)="downloadToExcel('환경과 발전량')"
              >
                Download
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="box2">
        <div class="box2_chart_box" id="box2_chart_box">
          <!-- IMPORTANT: no interpolation here; use a template ref -->
          <canvas #chart_pr id="chart_pr" class="chart_module"></canvas>
        </div>

        <div class="box2_table_box" id="box2_table_box">
          <table id="table" class="table">
            <tr class="table_tr">
              <td class="table_td_header">구분</td>

              <ng-container *ngIf="gbn === 'time'">
                <ng-container *ngFor="let data1 of tableData[0]; index as i">
                  <td class="table_td_header">
                    {{ i.toString().length === 1 ? "0" + i : i }} 시
                  </td>
                </ng-container>
              </ng-container>

              <ng-container *ngIf="gbn !== 'time'">
                <ng-container *ngFor="let d of dateList">
                  <td class="table_td_header">{{ d }}</td>
                </ng-container>
              </ng-container>
            </tr>

            <ng-container *ngFor="let row of tableData; index as i">
              <tr class="table_tr">
                <td class="table_td">{{ tableHeadData[i] }}</td>

                <ng-container *ngFor="let v of row">
                  <!-- 발전량 -->
                  <td
                    *ngIf="!isEnvRow(tableHeadData[i]) && v !== 0"
                    class="table_td"
                  >
                    {{ v }} kWh
                  </td>
                  <td
                    *ngIf="!isEnvRow(tableHeadData[i]) && v === 0"
                    class="table_td"
                  >
                    -
                  </td>

                  <!-- 온도 -->
                  <td
                    *ngIf="tableHeadData[i] === '온도' && v !== 0"
                    class="table_td"
                  >
                    {{ v }} °C
                  </td>
                  <td
                    *ngIf="tableHeadData[i] === '온도' && v === 0"
                    class="table_td"
                  >
                    -
                  </td>

                  <!-- 습도 -->
                  <td
                    *ngIf="tableHeadData[i] === '습도' && v !== 0"
                    class="table_td"
                  >
                    {{ v }} %
                  </td>
                  <td
                    *ngIf="tableHeadData[i] === '습도' && v === 0"
                    class="table_td"
                  >
                    -
                  </td>

                  <!-- 풍속 -->
                  <td
                    *ngIf="tableHeadData[i] === '풍속' && v !== 0"
                    class="table_td"
                  >
                    {{ v }} m/s
                  </td>
                  <td
                    *ngIf="tableHeadData[i] === '풍속' && v === 0"
                    class="table_td"
                  >
                    -
                  </td>

                  <!-- 일사량 -->
                  <td
                    *ngIf="tableHeadData[i] === '일사량' && v !== 0"
                    class="table_td"
                  >
                    {{ v }} Wh/㎡
                  </td>
                  <td
                    *ngIf="tableHeadData[i] === '일사량' && v === 0"
                    class="table_td"
                  >
                    -
                  </td>
                </ng-container>
              </tr>
            </ng-container>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
