<div class="main">
  <div class="col-md-12">
    <div class="box">
      <div class="box1">
        <div class="box1_header">
          <div class="box1_header_1">
            <div class="title">환경과 발전량</div>
            <div class="radio_box">
              <div class="radio_input1" (click)="radio_input1_click()">
                <input
                  id="radio_time"
                  type="radio"
                  name="time"
                  [value]="1"
                  [checked]="true"
                />
                시간별
              </div>
              <div class="radio_input2" (click)="radio_input2_click()">
                <input id="radio_day" type="radio" name="time" [value]="2" />
                일별
              </div>
              <div class="radio_input3" (click)="radio_input3_click()">
                <input id="radio_month" type="radio" name="time" [value]="3" />
                월별
              </div>
            </div>
            <div class="padding_text">조회기간 :</div>

            <div class="date_box">
              <!-- Day pickers -->
              <div id="date_start" class="data_box1">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="startPicker"
                  [(ngModel)]="startDate"
                  (dateChange)="onStartDaySelected($event.value)"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="startPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #startPicker
                  panelClass="example-month-picker"
                ></mat-datepicker>
              </div>

              <!-- Month pickers -->
              <div id="date_start_month" class="data_month_box">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="startMonthPicker"
                  [(ngModel)]="startMonthDate"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="startMonthPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #startMonthPicker
                  startView="year"
                  (yearSelected)="onStartMonthSelected($event)"
                  (monthSelected)="
                    onStartMonthMonthSelected($event, startMonthPicker)
                  "
                  panelClass="example-month-picker"
                ></mat-datepicker>
              </div>

              <div id="date_space" class="date_space">~</div>

              <div id="date_end" class="data_box2">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="endPicker"
                  [(ngModel)]="endDate"
                  (dateChange)="onEndDaySelected($event.value)"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="endPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #endPicker
                  panelClass="example-month-picker"
                ></mat-datepicker>
              </div>

              <div id="date_end_month" class="data_month_box">
                <input
                  class="data_input"
                  matInput
                  [matDatepicker]="endMonthPicker"
                  [(ngModel)]="endMonthDate"
                />
                <mat-datepicker-toggle
                  matSuffix
                  [for]="endMonthPicker"
                ></mat-datepicker-toggle>
                <mat-datepicker
                  #endMonthPicker
                  startView="year"
                  (yearSelected)="onEndMonthSelected($event)"
                  (monthSelected)="
                    onEndMonthMonthSelected($event, endMonthPicker)
                  "
                  panelClass="example-month-picker"
                ></mat-datepicker>
              </div>
            </div>

            <div class="search_box">
              <button class="search_btn" (click)="search_click()">조회</button>
            </div>
          </div>

          <div class="box1_header_2">
            <div class="download_box">
              <button
                class="download_btn"
                (click)="downloadToExcel('환경과 발전량')"
              >
                Download
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="box2">
        <div class="box2_chart_box" id="box2_chart_box">
          <div class="chart-container">
            <canvas id="chart_environment" class="chart_module">{{
              chart
            }}</canvas>
          </div>
        </div>

        <div class="box2_table_box" id="box2_table_box">
          <table id="table" class="table">
            <!-- Header -->
            <tr class="table_tr">
              <td class="table_td_header sticky-col">구분</td>

              <!-- 시간별 -->
              <ng-container *ngIf="gbn === 'time'">
                <ng-container *ngFor="let _ of tableData[0]; index as i">
                  <td class="table_td_header">{{ i < 10 ? "0" + i : i }} 시</td>
                </ng-container>
              </ng-container>

              <!-- 일별/월별 -->
              <ng-container *ngIf="gbn !== 'time'">
                <ng-container *ngFor="let d of dateList">
                  <td class="table_td_header">{{ d }}</td>
                </ng-container>
              </ng-container>
            </tr>

            <!-- Body -->
            <ng-container *ngFor="let row of tableData; index as i">
              <tr class="table_tr">
                <td class="table_td sticky-col">{{ tableHeadData[i] }}</td>

                <ng-container *ngFor="let v of row">
                  <!-- 발전량 (not env rows) — show <0.001 kWh for tiny non-zero -->
                  <td
                    *ngIf="
                      ['온도', '습도', '풍속', '일사량'].indexOf(
                        tableHeadData[i]
                      ) === -1
                    "
                    class="table_td"
                  >
                    {{ fmtEnergy(v) }}
                  </td>

                  <!-- 온도 -->
                  <td *ngIf="tableHeadData[i] === '온도'" class="table_td">
                    <ng-container *ngIf="v !== 0; else dash">
                      {{ v | number : "1.0-2" }} °C
                    </ng-container>
                  </td>

                  <!-- 습도 -->
                  <td *ngIf="tableHeadData[i] === '습도'" class="table_td">
                    <ng-container *ngIf="v !== 0; else dash">
                      {{ v | number : "1.0-2" }} %
                    </ng-container>
                  </td>

                  <!-- 풍속 -->
                  <td *ngIf="tableHeadData[i] === '풍속'" class="table_td">
                    <ng-container *ngIf="v !== 0; else dash">
                      {{ v | number : "1.0-2" }} m/s
                    </ng-container>
                  </td>

                  <!-- 일사량 -->
                  <td *ngIf="tableHeadData[i] === '일사량'" class="table_td">
                    <ng-container *ngIf="v !== 0; else dash">
                      {{ v | number : "1.0-2" }} Wh/㎡
                    </ng-container>
                  </td>

                  <ng-template #dash>-</ng-template>
                </ng-container>
              </tr>
            </ng-container>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
