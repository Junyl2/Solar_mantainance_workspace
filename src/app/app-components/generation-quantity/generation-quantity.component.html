<h2 class="f-page-title">인버터별 발전량</h2>

<mat-tab-group>
  <!-- ───────────────────── Timely (Hourly) ───────────────────── -->
  <mat-tab label="시간별 발전량">
    <div class="f-text-vct">
      <mat-form-field class="input" appearance="fill">
        <mat-label>일 선택</mat-label>
        <input
          matInput
          [matDatepicker]="timePicker"
          [(ngModel)]="timeDate"
          [min]="minTimeDate"
          [max]="maxTimeDate"
          (dateChange)="onHourlyDateSelected($event.value)"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="timePicker"
        ></mat-datepicker-toggle>
        <mat-datepicker
          #timePicker
          panelClass="example-month-picker"
        ></mat-datepicker>
      </mat-form-field>
      <a
        mat-raised-button
        class="f-form-field-button"
        (click)="updateHourlyPage()"
        >조회</a
      >
    </div>

    <!-- Fixed (non-scrolling) legend -->
    <div class="legend-fixed" *ngIf="hourlyLegend?.length">
      <ul class="legend-list">
        <li class="legend-item" *ngFor="let it of hourlyLegend">
          <span class="swatch" [style.background]="it.color"></span>
          <span class="legend-label" [title]="it.label">{{ it.label }}</span>
        </li>
      </ul>
    </div>

    <!-- Chart viewport: fixed height; horizontal scroll only -->
    <div class="chart-viewport">
      <div class="chart-scroll" [style.--cols]="chartTimeLabels?.length || 0">
        <bar-chart
          [hidden]="!showChart"
          class="chart chart-fluid"
          #barchartHourly
          [labels]="chartTimeLabels"
        ></bar-chart>
      </div>
      <div class="loading-overlay" *ngIf="isLoadingHourly">
        <mat-spinner diameter="36"></mat-spinner>
      </div>
    </div>

    <div class="table-scroll" *ngIf="!showChart">
      <table class="table">
        <tr>
          <th *ngFor="let x of tableTimeLabels">{{ x }}</th>
        </tr>
        <tr *ngFor="let timeData of tableTimeData; index as i">
          <td>{{ formatInvLabel(timeData) }}</td>
          <td *ngFor="let data of timeData.data; index as t">{{ data }}</td>
        </tr>
      </table>
    </div>
  </mat-tab>

  <!-- ───────────────────── Daily ───────────────────── -->
  <mat-tab label="일별 발전량">
    <div class="f-text-vct">
      <mat-form-field class="input" appearance="fill">
        <mat-label>시작일 선택</mat-label>
        <input
          matInput
          [matDatepicker]="startDailyPicker"
          [(ngModel)]="startDailyDate"
          [min]="startMinDailyDate"
          [max]="startMaxDailyDate"
          (dateChange)="onStartDailyDaySelected($event.value)"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="startDailyPicker"
        ></mat-datepicker-toggle>
        <mat-datepicker
          #startDailyPicker
          panelClass="example-month-picker"
        ></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="input" appearance="fill">
        <mat-label>끝일 선택</mat-label>
        <input
          matInput
          [matDatepicker]="endDailyPicker"
          [(ngModel)]="endDailyDate"
          [min]="endMinDailyDate"
          [max]="endMaxDailyDate"
          (dateChange)="onEndDailyDaySelected($event.value)"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="endDailyPicker"
        ></mat-datepicker-toggle>
        <mat-datepicker
          #endDailyPicker
          panelClass="example-month-picker"
        ></mat-datepicker>
      </mat-form-field>

      <a
        mat-raised-button
        class="f-form-field-button"
        (click)="updateDailyPage()"
        >조회</a
      >
    </div>

    <!-- Fixed legend -->
    <div class="legend-fixed" *ngIf="dailyLegend?.length">
      <ul class="legend-list">
        <li class="legend-item" *ngFor="let it of dailyLegend">
          <span class="swatch" [style.background]="it.color"></span>
          <span class="legend-label" [title]="it.label">{{ it.label }}</span>
        </li>
      </ul>
    </div>

    <div class="chart-viewport">
      <div class="chart-scroll" [style.--cols]="chartDailyLabels?.length || 0">
        <bar-chart
          [hidden]="!showChart"
          class="chart chart-fluid"
          #barchartDaily
          [labels]="chartDailyLabels"
        ></bar-chart>
      </div>
      <div class="loading-overlay" *ngIf="isLoadingDaily">
        <mat-spinner diameter="36"></mat-spinner>
      </div>
    </div>

    <div class="table-scroll" *ngIf="!showChart">
      <table class="table">
        <tr>
          <th *ngFor="let x of tableDailyLabels">{{ x }}</th>
        </tr>
        <tr *ngFor="let dailyData of tableDailyData; index as i">
          <td>{{ formatInvLabel(dailyData) }}</td>
          <td *ngFor="let data of dailyData.data; index as t">{{ data }}</td>
        </tr>
      </table>
    </div>
  </mat-tab>

  <!-- ───────────────────── Monthly ───────────────────── -->
  <mat-tab label="월별 발전량">
    <div class="f-text-vct">
      <mat-form-field class="input" appearance="fill">
        <mat-label>시작년월 선택</mat-label>
        <input
          matInput
          [matDatepicker]="startMonthlyPicker"
          [(ngModel)]="startMonthlyDate"
          [min]="startMinMonthlyDate"
          [max]="startMaxMonthlyDate"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="startMonthlyPicker"
        ></mat-datepicker-toggle>
        <mat-datepicker
          #startMonthlyPicker
          startView="year"
          (yearSelected)="onStartMonthlyYearSelected($event)"
          (monthSelected)="
            onStartMonthlyMonthSelected($event, startMonthlyPicker)
          "
          panelClass="example-month-picker"
        ></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="input" appearance="fill">
        <mat-label>끝년월 선택</mat-label>
        <input
          matInput
          [matDatepicker]="endMonthlyPicker"
          [(ngModel)]="endMonthlyDate"
          [min]="endMinMonthlyDate"
          [max]="endMaxMonthlyDate"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="endMonthlyPicker"
        ></mat-datepicker-toggle>
        <mat-datepicker
          #endMonthlyPicker
          startView="year"
          (yearSelected)="onEndMonthlyYearSelected($event)"
          (monthSelected)="onEndMonthlyMonthSelected($event, endMonthlyPicker)"
          panelClass="example-month-picker"
        ></mat-datepicker>
      </mat-form-field>

      <a
        mat-raised-button
        class="f-form-field-button"
        (click)="updateMonthlyPage()"
        >조회</a
      >
    </div>

    <!-- Fixed legend -->
    <div class="legend-fixed" *ngIf="monthlyLegend?.length">
      <ul class="legend-list">
        <li class="legend-item" *ngFor="let it of monthlyLegend">
          <span class="swatch" [style.background]="it.color"></span>
          <span class="legend-label" [title]="it.label">{{ it.label }}</span>
        </li>
      </ul>
    </div>

    <div class="chart-viewport">
      <div
        class="chart-scroll"
        [style.--cols]="chartMonthlyLabels?.length || 0"
      >
        <bar-chart
          [hidden]="!showChart"
          class="chart chart-fluid"
          responsive="true"
          #barchartMonthly
          [labels]="chartMonthlyLabels"
        ></bar-chart>
      </div>
      <div class="loading-overlay" *ngIf="isLoadingMonthly">
        <mat-spinner diameter="36"></mat-spinner>
      </div>
    </div>

    <div class="table-scroll" *ngIf="!showChart">
      <table class="table">
        <tr>
          <th *ngFor="let x of tableMonthlyLabels">{{ x }}</th>
        </tr>
        <tr *ngFor="let monthlyData of tableMonthlyData; index as i">
          <td>{{ formatInvLabel(monthlyData) }}</td>
          <td *ngFor="let data of monthlyData.data; index as t">{{ data }}</td>
        </tr>
      </table>
    </div>
  </mat-tab>

  <!-- Toggle -->
  <mat-tab disabled>
    <ng-template mat-tab-label>
      <button
        class="f-mat-tab-button"
        (click)="viewChart(true)"
        mat-raised-button
      >
        차트 보기
      </button>
      <button
        class="f-mat-tab-button"
        (click)="viewChart(false)"
        mat-raised-button
      >
        표 보기
      </button>
    </ng-template>
  </mat-tab>
</mat-tab-group>
