<!doctype html>
<html lang="en">

<head>
  <title>Signin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="text-center justify-content-center">
  <main class="signin-main">
    <div>
      <h3 class="h4 mb-1 fw-normal">ENERGE INTEGRATED WEB MONITORING</h3>
      <h1 class="signin-title mb-3">CAPTURE STAR M</h1>
    </div>
    <form class="form-signin" [formGroup]="form" (ngSubmit)="onSubmit()">
      <h1 class="h3 mb-3 fw-normal">Signin</h1>
      <div class="form-floating">
        <input type="text" formControlName="account" class="form-control" id="floatingInput" placeholder="계정정보">
        <label for="floatingInput">Account</label>
      </div>
      <div class="form-floating">
        <input type="password" formControlName="password" class="form-control" id="floatingPassword" placeholder="비밀번호">
        <label for="floatingPassword">Password</label>
      </div>
      <div class="mb-3">
      </div>
      <button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
    </form>
    <p class="mt-5 mb-3 text-muted">COPYRIGHT ⓒ 2021 ON-TEST. ALL RIGHTS RESERVED.</p>
    <div class="mt-4">
      <img [src]="'assets/Images/header-logo.svg'" alt="온테스트" />
    </div>
    <div *ngIf="showLoginError==true" class="full-overlay d-flex justify-content-center align-items-center">
    </div>
    <div *ngIf="showLoginError==true" class="full-overlay-no-opacity d-flex justify-content-center align-items-center">
      <div class="message-box d-flex justify-content-center align-items-center">
        <div>
          <h3 class="message-content-title">로그인에 실패하였습니다.</h3>
          <div class="message-content">아이디 혹은 비밀번호가 맞지 않습니다.</div>
          <button mat-raised-button color="primary" (click)="confirmLoginError()">확인</button>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
